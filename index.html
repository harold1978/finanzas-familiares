<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Finanzas Familiares</title>
<meta name="theme-color" content="#0f766e">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 64 64%27%3E%3Crect width=%2764%27 height=%2764%27 rx=%2716%27 fill=%27%230f766e%27/%3E%3Ctext x=%2732%27 y=%2745%27 font-size=%2740%27 text-anchor=%27middle%27 fill=%27white%27 font-family=%27sans-serif%27 font-weight=%27bold%27%3E%E2%82%A1%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="app">
  <aside class="side" id="side">
    <div class="brand"><span class="logo">₡</span><div><b>Finanzas</b><small>Familiares</small></div></div>
    <nav id="nav"></nav>
    <div class="side-foot">
      <div class="sync" id="syncBadge"><i></i><span>—</span></div>
      <button class="btn ghost sm" id="themeBtn" title="Cambiar tema">🌓 Tema</button>
    </div>
  </aside>

  <main class="main">
    <header class="top">
      <button class="icon-btn menu" id="menuBtn" aria-label="Menú">☰</button>
      <h1 id="title">Resumen</h1>
      <div class="month-pick">
        <button class="icon-btn" id="prevM" aria-label="Mes anterior">‹</button>
        <input type="month" id="monthInp" aria-label="Mes">
        <button class="icon-btn" id="nextM" aria-label="Mes siguiente">›</button>
      </div>
    </header>
    <section id="view" class="view"></section>
  </main>
</div>

<div class="fab-wrap">
  <button class="fab alt" id="fabIng" title="Nuevo ingreso">＋ Ingreso</button>
  <button class="fab" id="fabGas" title="Nuevo gasto (tecla N)">＋ Gasto</button>
</div>

<div class="modal-bg" id="modalBg" hidden>
  <div class="modal" role="dialog" aria-modal="true">
    <div class="modal-h"><h2 id="modalTitle"></h2><button class="icon-btn" id="modalX" aria-label="Cerrar">✕</button></div>
    <div id="modalBody"></div>
  </div>
</div>
<div id="toasts"></div>

<script src="seed.js"></script>
<script src="firebase-config.js"></script>
<script type="module" src="app.js"></script>
</body>
</html>
